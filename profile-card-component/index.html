<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile card component | Frontend Mentor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kumbh+Sans:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/main.css">
</head>

<body>
  <main class="main">
    <article class="profile-card">
      <div class="profile-bg">
        <img class="profile-image" src="./assets/image/image-victor.jpg" alt="Victor Crest">
      </div>

      <div class="profile-info">
        <div class="user-details">
          <h1 class="text01 navy-950">Victor Crest <span class="text01-regular gray-500 user-age">26</span></h1>
          <p class="text02 gray-500">London</p>
        </div>

        <ul class="user-stats">
          <li class="stats-item">
            <span class="text01 navy-950">80K</span>
            <span class="text03 gray-500">Followers</span>
          </li>

          <li class="stats-item">
            <span class="text01 navy-950">803K</span>
            <span class="text03 gray-500">Likes</span>
          </li>

          <li class="stats-item">
            <span class="text01 navy-950">1.4K</span>
            <span class="text03 gray-500">Photos</span>
          </li>
        </ul>

      </div>
    </article>
  </main>

</body>

</html>
